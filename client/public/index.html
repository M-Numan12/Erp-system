  <script>
    window.onerror = function (msg, url, line, col, error) {
      var err = document.createElement('div');
      err.style.cssText = 'background:red;color:white;padding:20px;z-index:9999;position:fixed;top:0;left:0;width:100%;';
      err.innerHTML = '<h2>Global Error:</h2>' + msg + '<br/>Line: ' + line;
      document.body.appendChild(err);
    };
    window.onunhandledrejection = function (e) {
      var err = document.createElement('div');
      err.style.cssText = 'background:red;color:white;padding:20px;z-index:9999;position:fixed;top:0;left:0;width:100%;';
      err.innerHTML = '<h2>Promise Error:</h2>' + (e.reason ? e.reason.toString() : 'Unknown');
      document.body.appendChild(err);
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
